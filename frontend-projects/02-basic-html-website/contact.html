<body>

    <header>

        <!-- LOGO -->
        <div id="logo">
            <a href="index.html"><img src="images/Logo.png" alt="Logo" width="100" height="100"></a>
        </div>
        <p class="logo-name">Mario Rossi</p>

        <!-- NAVIGATION BAR -->
        <nav class="menù">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="articles.html">Articles</a>
            <a href="contact.html">Contact</a>
        </nav>
        <!-- HEADING AND DESCRIPTION -->
        <div class="contact-heading">
            <h1 class="contact-title">Contact</h1>
            <p class="contact-introduction">Here you can find all my contacts!</p>
        </div>
    </header>

    <main>
        <!-- CONTACT ME - EMAIL FORM -->
        <form action="https://example.org">
            <h2>Send me a message!</h2>
            <label for="name">*Name:</label>
            <input type="text" id="name" name="name" placeholder="Mario" required>
            <label for="surname">*Surname:</label>
            <input type="text" id="surname" name="surname" placeholder="Rossi" required>
            <label for="email">*Email:</label>
            <input type="email" id="email" name="email" placeholder="mario.rossi@example.org" required>
            <label for="tel">Telephone (Optional):</label>
            <input type="tel" id="tel" name="tel" placeholder="+39 123 4567 890">
            <label for="message">Type here your message:</label>
            <textarea id="message" name="message"></textarea>
            <button>Submit</button>
            <p>Fields with stars (*) are <strong>required</strong>!</p>
        </form>



    </main>

    <footer>
        <!-- ADDRESS -->
        <h2>Address information:</h2>
        <address>
            <p>Email: mario.rossi@example.com</p>
            <p>Tel: +39 347 1234 364</p>
            <p><a href="https://github.com" target="_blank"><img src="images/github_icon.png" alt="GitHub's Logo"
                        width="30" height="30"></a>
            </p>
            <p><a href="https://linkedin.com" target="_blank"><img src="images/linkedin_icon.png" alt="LinkedIn's Logo"
                        width="30" height="30"></a></p>
        </address>

    </footer>
